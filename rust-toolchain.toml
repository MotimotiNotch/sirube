# ツールチェーンを固定する。
#
# Windows での初回ビルドは、Git Bash の GNU coreutils の `link` が MSVC の
# link.exe より先に解決される、vcvars を通さないと LIB/INCLUDE が落ちて
# LNK1181 になる、といった「Rust とは無関係に見えるエラー」で一日溶ける。
# 実行環境が動くと再現しないので、せめて手元と CI で同じ rustc を使う。
#
# ビルドは `bun run release`（内部で scripts/with-msvc.bat 経由）を正とする。
[toolchain]
channel = "1.98.0"
targets = ["x86_64-pc-windows-msvc"]
