[package]
name = "sirube"
version = "0.3.3"
description = "目的から「それには何が必要か」を辿ると、末端に今日できることが現れる。半年空けても、道は残っている。"
authors = ["nocchi"]
license = "MIT"
repository = "https://github.com/MotimotiNotch/sirube"
edition = "2021"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sirube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# `watch` はフィーチャの下にある。有効にしないと watcher モジュールごと消え、
# capabilities に fs:allow-watch を書いていても実行時に "Command watch not found"
# になる（2026-08-31 の初回起動で踏んだ）。外部編集の即時反映は必須機能。
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-dialog = "2.7.2"

# Linux だけ: WebView の入力メソッドの設定に触る（lib.rs の on_page_load）。
# 版は wry が固定しているもの（=2.0.2）に揃える。ずれると別の型になって渡せない。
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
